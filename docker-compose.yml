services:
  postgres:
    image: postgres:17-alpine
    container_name: smartbiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbiz
      POSTGRES_USER: smartbiz
      POSTGRES_PASSWORD: smartbiz_dev_password
    ports:
      - "5432:5432"
    volumes:
      - smartbiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbiz -d smartbiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartbiz_pgdata:
